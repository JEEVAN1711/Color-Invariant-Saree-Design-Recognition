services:
  - type: web
    name: saree-design-recognition
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && npm --prefix frontend install && npm --prefix frontend run build"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
